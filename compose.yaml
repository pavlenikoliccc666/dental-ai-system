services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smile-dental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smile_app
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: smile_dental
    ports:
      - "5432:5432"
    volumes:
      - smile_dental_data:/var/lib/postgresql/data

volumes:
  smile_dental_data:

    name: dentalreceptionist_smile_dental_data